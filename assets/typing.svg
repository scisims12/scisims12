<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="94" viewBox="0 0 1200 94" role="img" aria-labelledby="title desc">
<title id="title">Build. Learn. Improve. Repeat.</title><desc id="desc">A terminal cycles through Android development, web development, and real-time experiences.</desc>
<defs><clipPath id="type"><rect class="mask" x="93" y="15" width="970" height="60"/></clipPath></defs>
<style>text{font-family:Consolas,'Courier New',monospace}.mask{animation:type 4s steps(34,end) infinite}.a{animation:a 12s step-end infinite}.b{animation:b 12s step-end infinite}.c{animation:c 12s step-end infinite}@keyframes type{0%{width:0}55%,85%{width:970px}100%{width:0}}@keyframes a{0%{opacity:1}33.333%,100%{opacity:0}}@keyframes b{0%{opacity:0}33.333%{opacity:1}66.666%,100%{opacity:0}}@keyframes c{0%,33.333%{opacity:0}66.666%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.b,.c{display:none}}</style>
<rect x="1" y="1" width="1198" height="92" rx="14" fill="#101021" stroke="#2d2848"/>
<text x="38" y="57" fill="#22d3ee" font-size="27">❯</text><g clip-path="url(#type)" fill="#c4b5fd" font-size="26"><text x="95" y="57" class="a">Building Android experiences with Kotlin. _</text><text x="95" y="57" class="b">Turning ideas into beautiful web interfaces. _</text><text x="95" y="57" class="c">Music. Movies. Watch parties. One developer. _</text></g>
