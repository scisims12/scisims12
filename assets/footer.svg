<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">See you in the next commit.</title><desc id="desc">A violet and cyan call to connect, with animated orbital rings.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.r{animation:r 6s linear infinite;transform-origin:1035px 125px}.s{animation:s 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@keyframes s{to{stroke-dashoffset:-600}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1198" height="248" rx="20" fill="#101021" stroke="#2d2848"/><text x="44" y="51" fill="#22d3ee" font-size="12" letter-spacing="3">KEEP CREATING. KEEP EXPLORING.</text><text x="41" y="117" fill="#f2eefc" font-size="44" font-weight="750" letter-spacing="-1">See you in the</text><text x="41" y="171" fill="#a78bfa" font-size="44" font-weight="750" letter-spacing="-1">next commit.</text><text x="44" y="211" fill="#aaa3bd" font-size="15">Great things start with small ideas.</text><circle cx="1035" cy="125" r="72" fill="#16152c" stroke="#49385f"/><circle class="r" cx="1035" cy="125" r="90" fill="none" stroke="#a78bfa" stroke-dasharray="100 40 4 40"/><path d="M1007 153L1063 97M1011 97H1063V149" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s" d="M44 235H1155" stroke="#22d3ee" stroke-width="2" stroke-dasharray="40 560"/></svg>
