<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Priyanshu Sharma — Android, Web and Real-Time Experiences</title><desc id="desc">An animated violet and cyan developer identity, with orbiting light trails and a constellation of project names.</desc>
<defs><radialGradient id="glow"><stop stop-color="#302550"/><stop offset="1" stop-color="#0d1117"/></radialGradient><linearGradient id="neon"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#37304c" stroke-opacity=".35"/></pattern></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.orbit{transform-origin:957px 263px;animation:spin 6s linear infinite}.rev{animation-direction:reverse}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}.signal{animation:signal 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes signal{to{stroke-dashoffset:-600}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
