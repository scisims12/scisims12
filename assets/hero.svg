<text x="42" y="330" fill="#f2eefc" font-size="102" letter-spacing="-4" font-weight="800">SHARMA<tspan fill="#22d3ee">.</tspan></text>
<text x="49" y="376" fill="#a78bfa" font-size="23" font-weight="600">Build. Learn. Improve. Repeat.</text><text x="49" y="412" fill="#a8a4b6" font-size="17">Music. Movies. Shared moments. Made with code.</text>
